name: Update Scoop Bucket

# Manual re-run only.
#
# This used to listen on `release: published` and never once fired by itself.
# The GitHub Release is created by `dist host` inside release.yml using that
# job's `GITHUB_TOKEN`, and GitHub deliberately does not start workflow runs
# from events raised by a `GITHUB_TOKEN` — that is the recursion guard. The tag
# push triggers fine because it carries user credentials, which is why
# release.yml itself runs and this never did.
#
# The Scoop update is now a job inside release.yml, hanging off the same tag
# push as everything else (`publish-scoop-manifest`), exactly like the Homebrew
# formula. What remains here is the manual path: re-publishing the manifest for
# an already-released tag without re-running the whole release.
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag (e.g., v3.1.0)'
        required: true
        type: string

permissions:
  contents: read

jobs:
  update-scoop:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout belaf (for the manifest script)
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Checkout scoop-bucket
        uses: actions/checkout@v6
        with:
          repository: ilblu/scoop-bucket
          token: ${{ secrets.SCOOP_BUCKET_TOKEN }}
          path: scoop-bucket

      - name: Update Scoop manifest
        run: .github/scripts/update-scoop.sh "${{ inputs.release_tag }}" scoop-bucket
